name: Render Roblox Avatar

on:
  push:
    branches:
      - main
    paths:
      - 'HearthandsType/**'
      - 'ClassicType/**'
      - 'backgrounds/**'
      - 'WomanRig.blend'
      - 'scripts/**'
      - 'tests/**'
      - 'requirements.txt'
  workflow_dispatch:
    inputs:
      username:
        description: 'Optionaler Roblox-Benutzername (leer lassen, um die Konfigurationsdatei des GFX-Typs zu nutzen)'
        required: false
        type: string
      gfx-type:
        description: 'GFX-Typ: HearthandsType (Preppy Hearthands Type), ClassicType (R15) oder Both (beide)'
        required: false
        type: string
        default: 'HearthandsType'

permissions:
  contents: write

concurrency:
  group: render-avatar
  cancel-in-progress: true

jobs:
  render:
    name: R6/R15 Avatar GFX Render (Blender Cycles)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Python 3.11 einrichten
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Umgebung installieren & Avatar rendern
        id: execute
        continue-on-error: true
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_USERNAME: ${{ inputs.username }}
          GFX_TYPE: ${{ inputs.gfx-type }}
          # Diagnose: historische Classic-Kleidungs-Assets direkt laden und
          # ihre Templates im Diagnose-Tag veroeffentlichen.
          PROBE_CLOTHING_ASSETS: "10349332990,84753441338053,115182347741"
          # Diagnose: ein Koerperteil-Asset (Asset-ID:Asset-Typ) ersetzt das
          # Inventar-Koerperteil dieses Typs - z. B. die Kokosnuss-Nase.
          PROBE_BODY_PART_ASSETS: "100234186631845:31"
        run: |
          set -uo pipefail

          # GFX-Typ und Config-Datei ermitteln.
          # Bei workflow_dispatch hat der Nutzer-Input Vorrang.
          # Bei Push-Events wird aus den geänderten Dateien abgeleitet, welche
          # GFX-Typen betroffen sind:
          #   * ClassicType-Ordner + ClassicType-eigene Skripte -> ClassicType
          #   * HearthandsType-Ordner + HearthandsType-eigene Skripte -> HearthandsType
          #   * gemeinsame Dateien (Loader, Pipeline, Tests) -> beide Typen
          # "latest-render" zeigt weiterhin den primaeren Typ, die weiteren
          # Render landen als avatar-<typ>.png im selben Tag.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            GFX_TYPE="${GFX_TYPE:-HearthandsType}"
            case "$GFX_TYPE" in
              Both|both|BOTH)
                # Beide GFX-Typen rendern; "latest-render" zeigt weiterhin
                # den primaeren Typ HearthandsType.
                GFX_TYPES="ClassicType HearthandsType"
                GFX_TYPE="HearthandsType"
                ;;
              *)
                GFX_TYPES="$GFX_TYPE"
                ;;
            esac
          else
            CHANGED=$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" 2>/dev/null || true)
            CLASSIC_CHANGED=0
            HEARTHANDS_CHANGED=0
            SHARED_CHANGED=0
            if echo "$CHANGED" | grep -qE '^ClassicType/|^scripts/(classic_render|r15_blocky_rig|r15_clothing)\.py$'; then
              CLASSIC_CHANGED=1
            fi
            if echo "$CHANGED" | grep -qE '^HearthandsType/|^scripts/blender_render\.py$'; then
              HEARTHANDS_CHANGED=1
            fi
            if echo "$CHANGED" | grep -qE '^(scripts/(roblox_opencloud|run_render_pipeline|rbx_formats|render_config|gfx_layout|image_compositing|brick_colors)\.py|tests/|requirements\.txt)'; then
              SHARED_CHANGED=1
            fi
            # "latest-render" zeigt den primaeren Typ; gemeinsame Aenderungen
            # rendern zusaetzlich den ClassicType mit (Standard bleibt
            # HearthandsType, damit der Tag nicht unbemerkt wechselt).
            if [ "$CLASSIC_CHANGED" = "1" ]; then
              GFX_TYPE="ClassicType"
            else
              GFX_TYPE="HearthandsType"
            fi
            GFX_TYPES="$GFX_TYPE"
            if [ "$CLASSIC_CHANGED" = "1" ] && [ "$HEARTHANDS_CHANGED" = "0" ] && [ "$SHARED_CHANGED" = "0" ]; then
              GFX_TYPES="ClassicType"
            elif [ "$CLASSIC_CHANGED" = "0" ] && [ "$HEARTHANDS_CHANGED" = "1" ] && [ "$SHARED_CHANGED" = "0" ]; then
              GFX_TYPES="HearthandsType"
            else
              GFX_TYPES="ClassicType HearthandsType"
            fi
          fi
          echo "Render-GFX-Typen:$GFX_TYPES (primaer: $GFX_TYPE)"

          # 1. System-Bibliotheken für Headless Blender 5.x Cycles (Xvfb / OpenGL)
          if ! sudo apt-get update -qq >/tmp/setup.log 2>&1 || \
             ! sudo apt-get install -y --no-install-recommends \
               xvfb libegl1 libgl1 libgl1-mesa-dri libglx-mesa0 libgbm1 libgles2 \
               libxrender1 libxfixes3 libxi6 libxkbcommon0 libsm6 libice6 \
               libxcursor1 libxinerama1 libxrandr2 >>/tmp/setup.log 2>&1; then
            echo "Fehler beim Installieren der Linux-OpenGL/Xvfb-Pakete:" >/tmp/fatal_error.txt
            tail -n 40 /tmp/setup.log >>/tmp/fatal_error.txt
            exit 1
          fi

          # 2. Python-Pakete inkl. bpy==5.0.1 installieren
          if ! pip install --quiet -r requirements.txt >>/tmp/setup.log 2>&1; then
            echo "Fehler beim Installieren der Python-Abhängigkeiten (requirements.txt):" >/tmp/fatal_error.txt
            tail -n 40 /tmp/setup.log >>/tmp/fatal_error.txt
            exit 1
          fi

          # 3. Blender-Regressionstests (Face-Keying, Szene-Preset, Materialien)
          if ! LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a python -m unittest discover -s tests -v \
               >/tmp/test_stdout.log 2>/tmp/test_stderr.log; then
            {
              echo "Blender-Regressionstests fehlgeschlagen:"
              cat /tmp/test_stdout.log
              cat /tmp/test_stderr.log
            } >/tmp/fatal_error.txt
            exit 1
          fi

          mkdir -p /tmp/render_out

          # 4. Roblox-Avatar und Render-Konfiguration der betroffenen GFX-Typen ausführen
          for TYPE in $GFX_TYPES; do
            CONFIG_FILE="${TYPE}/configs.toml"
            if ! LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a -s "-screen 0 1920x1080x24 +extension GLX +render -noreset" \
                 python scripts/run_render_pipeline.py \
                   --config-file "$CONFIG_FILE" \
                   --gfx-type "$TYPE" \
                   --blend-file WomanRig.blend \
                   --output "/tmp/render_out/avatar-${TYPE}.png" \
                   --status-json "/tmp/render_status-${TYPE}.json" \
                 >"/tmp/blender_stdout-${TYPE}.log" 2>"/tmp/blender_stderr-${TYPE}.log"; then
              if [ ! -f "/tmp/render_status-${TYPE}.json" ]; then
                {
                  echo "Blender/Render-Prozess unerwartet beendet (${TYPE}):"
                  tail -n 45 "/tmp/blender_stderr-${TYPE}.log"
                } >/tmp/fatal_error.txt
              fi
              exit 1
            fi
            if [ "$TYPE" = "$GFX_TYPE" ]; then
              cp "/tmp/render_out/avatar-${TYPE}.png" /tmp/render_out/avatar.png
            fi
          done

          # 5. Aktuelles Render-Ergebnis ohne Git-History-Müll auf main als einzelnen Orphan-Tag & Release speichern
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          BLOB_PRIMARY=$(git hash-object -w /tmp/render_out/avatar.png)
          {
            printf '100644 blob %s\tavatar.png\n' "$BLOB_PRIMARY"
            for TYPE in $GFX_TYPES; do
              BLOB=$(git hash-object -w "/tmp/render_out/avatar-${TYPE}.png")
              printf '100644 blob %s\tavatar-%s.png\n' "$BLOB" "$TYPE"
            done
          } | git mktree > /tmp/tree_sha.txt
          TREE_SHA=$(cat /tmp/tree_sha.txt)
          COMMIT_SHA=$(git commit-tree "$TREE_SHA" -m "Latest avatar render ($GFX_TYPE)")

          if ! git push --force origin "${COMMIT_SHA}:refs/tags/latest-render" >/tmp/push_err.log 2>&1; then
            {
              echo "Fehler beim Speichern des gerenderten Bildes im Repository-Tag 'latest-render':"
              cat /tmp/push_err.log
            } >/tmp/fatal_error.txt
            exit 1
          fi

          # Rolling GitHub Release ("Version") aktualisieren, sodass immer nur das neueste Bild dort liegt
          gh release delete latest-render --yes >/dev/null 2>&1 || true
          gh release create latest-render /tmp/render_out/avatar.png \
            --target "$COMMIT_SHA" \
            --title "Aktuelles Avatar Render ($GFX_TYPE)" \
            --notes "Automatisch gerenderter Roblox Avatar ($GFX_TYPE, Blender Cycles, Hintergrund gemäß ${GFX_TYPE}/configs.toml)." \
            >/dev/null 2>&1 || true

          echo "RENDER_IMAGE_URL=https://github.com/${GITHUB_REPOSITORY}/blob/${COMMIT_SHA}/avatar.png?raw=true" >> "$GITHUB_ENV"

      - name: Render-Artefakt speichern
        if: steps.execute.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: avatar-render-latest
          path: /tmp/render_out/
          retention-days: 7

      # Diagnose-Tag mit Logs, Status-JSON und Render-Bildern. Wird bei jedem
      # Lauf gepusht: die CI-Logs selbst sind ueber die GitHub-API nicht
      # abrufbar, ueber diesen Tag aber auswertbar.
      - name: Diagnose-Tag veröffentlichen
        if: always()
        run: |
          set -uo pipefail
          mkdir -p /tmp/debug_out
          cp -f /tmp/blender_stdout-*.log /tmp/debug_out/ 2>/dev/null || true
          cp -f /tmp/blender_stderr-*.log /tmp/debug_out/ 2>/dev/null || true
          cp -f /tmp/render_status-*.json /tmp/debug_out/ 2>/dev/null || true
          cp -f /tmp/fatal_error.txt /tmp/debug_out/ 2>/dev/null || true
          cp -f /tmp/render_out/*.png /tmp/render_out/*.json /tmp/render_out/*.mesh /tmp/debug_out/ 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          {
            for f in /tmp/debug_out/*; do
              [ -f "$f" ] || continue
              printf '100644 blob %s\t%s\n' "$(git hash-object -w "$f")" "$(basename "$f")"
            done
          } | git mktree > /tmp/debug_tree.txt
          TREE_SHA=$(cat /tmp/debug_tree.txt)
          COMMIT_SHA=$(git commit-tree "$TREE_SHA" -m "Render diagnostics")
          git push --force origin "${COMMIT_SHA}:refs/tags/latest-render-debug" >/dev/null 2>&1 || true

      - name: Workflow-Übersicht ausgeben
        if: always()
        run: |
          set -euo pipefail
          : > "$GITHUB_STEP_SUMMARY"

          if [ "${{ steps.execute.outcome }}" = "success" ] && [ -n "${RENDER_IMAGE_URL:-}" ]; then
            printf '![Rendered Avatar](%s)\n' "$RENDER_IMAGE_URL" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [ -f /tmp/fatal_error.txt ]; then
            ERR_TEXT=$(cat /tmp/fatal_error.txt)
          elif ls /tmp/render_status-*.json >/dev/null 2>&1; then
            ERR_TEXT=$(python -c 'import glob, json; texts = [json.load(open(p, encoding="utf-8")).get("error", "") for p in glob.glob("/tmp/render_status-*.json")]; print(" | ".join(t for t in texts if t) or "Unbekannter Fehler")')
          elif [ -f /tmp/render_status.json ]; then
            ERR_TEXT=$(python -c 'import json; print(json.load(open("/tmp/render_status.json", encoding="utf-8")).get("error", "Unbekannter Fehler"))')
          elif [ -f /tmp/fatal_error.txt ]; then
            ERR_TEXT=$(cat /tmp/fatal_error.txt)
          else
            ERR_TEXT="Der Render-Workflow wurde abgebrochen oder ist fehlgeschlagen, bevor ein Fehlerbericht geschrieben werden konnte."
          fi

          {
            echo "### Render-Fehler"
            echo ""
            echo '```text'
            printf '%s\n' "$ERR_TEXT"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1
