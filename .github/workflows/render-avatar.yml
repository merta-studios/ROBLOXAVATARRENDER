name: Render Roblox Avatar

on:
  push:
    branches:
      - main
    paths:
      - 'HearthandsType/**'
      - 'ClassicType/**'
      - 'backgrounds/**'
      - 'WomanRig.blend'
      - 'scripts/**'
      - 'tests/**'
      - 'requirements.txt'
  workflow_dispatch:
    inputs:
      username:
        description: 'Optionaler Roblox-Benutzername (leer lassen, um die Konfigurationsdatei des GFX-Typs zu nutzen)'
        required: false
        type: string
      gfx-type:
        description: 'GFX-Typ: HearthandsType (Preppy Hearthands Type) oder ClassicType'
        required: false
        type: string
        default: 'HearthandsType'

permissions:
  contents: write

concurrency:
  group: render-avatar
  cancel-in-progress: true

jobs:
  render:
    name: R6/R15 Avatar GFX Render (Blender Cycles)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          persist-credentials: true

      - name: Python 3.11 einrichten
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Umgebung installieren & Avatar rendern
        id: execute
        continue-on-error: true
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_USERNAME: ${{ inputs.username }}
          GFX_TYPE: ${{ inputs.gfx-type }}
        run: |
          set -uo pipefail

          # GFX-Typ ermitteln: workflow_dispatch-Input hat Vorrang.
          # Bei Push-Events wird aus den geänderten Dateien abgeleitet,
          # welcher GFX-Typ-Ordner betroffen ist (ClassicType oder HearthandsType).
          if [ "${GFX_TYPE:-}" != "" ]; then
            CONFIG_FILE="${GFX_TYPE}/configs.toml"
          else
            CHANGED=$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" 2>/dev/null || true)
            if echo "$CHANGED" | grep -qE '^ClassicType/'; then
              GFX_TYPE="ClassicType"
              CONFIG_FILE="ClassicType/configs.toml"
            elif echo "$CHANGED" | grep -qE '^HearthandsType/'; then
              GFX_TYPE="HearthandsType"
              CONFIG_FILE="HearthandsType/configs.toml"
            else
              GFX_TYPE="HearthandsType"
              CONFIG_FILE="HearthandsType/configs.toml"
            fi
          fi

          # 1. System-Bibliotheken für Headless Blender 5.x Cycles (Xvfb / OpenGL)
          if ! sudo apt-get update -qq >/tmp/setup.log 2>&1 || \
             ! sudo apt-get install -y --no-install-recommends \
               xvfb libegl1 libgl1 libgl1-mesa-dri libglx-mesa0 libgbm1 libgles2 \
               libxrender1 libxfixes3 libxi6 libxkbcommon0 libsm6 libice6 \
               libxcursor1 libxinerama1 libxrandr2 >>/tmp/setup.log 2>&1; then
            echo "Fehler beim Installieren der Linux-OpenGL/Xvfb-Pakete:" >/tmp/fatal_error.txt
            tail -n 40 /tmp/setup.log >>/tmp/fatal_error.txt
            exit 1
          fi

          # 2. Python-Pakete inkl. bpy==5.0.1 installieren
          if ! pip install --quiet -r requirements.txt >>/tmp/setup.log 2>&1; then
            echo "Fehler beim Installieren der Python-Abhängigkeiten (requirements.txt):" >/tmp/fatal_error.txt
            tail -n 40 /tmp/setup.log >>/tmp/fatal_error.txt
            exit 1
          fi

          # 3. Blender-Regressionstests (Face-Keying, Szene-Preset, Materialien)
          if ! LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a python -m unittest discover -s tests -v \
               >/tmp/test_stdout.log 2>/tmp/test_stderr.log; then
            {
              echo "Blender-Regressionstests fehlgeschlagen:"
              cat /tmp/test_stdout.log
              cat /tmp/test_stderr.log
            } >/tmp/fatal_error.txt
            exit 1
          fi

          mkdir -p /tmp/render_out

          # 4. Roblox-Avatar und Render-Konfiguration des gewählten GFX-Typs ausführen
          if ! LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a -s "-screen 0 1920x1080x24 +extension GLX +render -noreset" \
               python scripts/run_render_pipeline.py \
                 --config-file "$CONFIG_FILE" \
                 --gfx-type "$GFX_TYPE" \
                 --blend-file WomanRig.blend \
                 --output /tmp/render_out/avatar.png \
                 --status-json /tmp/render_status.json \
               >/tmp/blender_stdout.log 2>/tmp/blender_stderr.log; then
            if [ ! -f /tmp/render_status.json ]; then
              {
                echo "Blender/Render-Prozess unerwartet beendet:"
                tail -n 45 /tmp/blender_stderr.log
              } >/tmp/fatal_error.txt
            fi
            exit 1
          fi

          # 5. Aktuelles Render-Ergebnis ohne Git-History-Müll auf main als einzelnen Orphan-Tag & Release speichern
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          BLOB_SHA=$(git hash-object -w /tmp/render_out/avatar.png)
          TREE_SHA=$(printf "100644 blob %s\tavatar.png\n" "$BLOB_SHA" | git mktree)
          COMMIT_SHA=$(git commit-tree "$TREE_SHA" -m "Latest avatar render ($GFX_TYPE)")

          if ! git push --force origin "${COMMIT_SHA}:refs/tags/latest-render" >/tmp/push_err.log 2>&1; then
            {
              echo "Fehler beim Speichern des gerenderten Bildes im Repository-Tag 'latest-render':"
              cat /tmp/push_err.log
            } >/tmp/fatal_error.txt
            exit 1
          fi

          # Rolling GitHub Release ("Version") aktualisieren, sodass immer nur das neueste Bild dort liegt
          gh release delete latest-render --yes >/dev/null 2>&1 || true
          gh release create latest-render /tmp/render_out/avatar.png \
            --target "$COMMIT_SHA" \
            --title "Aktuelles Avatar Render ($GFX_TYPE)" \
            --notes "Automatisch gerenderter Roblox Avatar ($GFX_TYPE, Blender Cycles, Hintergrund gemäß $CONFIG_FILE)." \
            >/dev/null 2>&1 || true

          echo "RENDER_IMAGE_URL=https://github.com/${GITHUB_REPOSITORY}/blob/${COMMIT_SHA}/avatar.png?raw=true" >> "$GITHUB_ENV"

      - name: Render-Artefakt speichern
        if: steps.execute.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: avatar-render-latest
          path: /tmp/render_out/avatar.png
          retention-days: 7

      - name: Workflow-Übersicht ausgeben
        if: always()
        run: |
          set -euo pipefail
          : > "$GITHUB_STEP_SUMMARY"

          if [ "${{ steps.execute.outcome }}" = "success" ] && [ -n "${RENDER_IMAGE_URL:-}" ]; then
            printf '![Rendered Avatar](%s)\n' "$RENDER_IMAGE_URL" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [ -f /tmp/render_status.json ]; then
            ERR_TEXT=$(python -c 'import json; print(json.load(open("/tmp/render_status.json", encoding="utf-8")).get("error", "Unbekannter Fehler"))')
          elif [ -f /tmp/fatal_error.txt ]; then
            ERR_TEXT=$(cat /tmp/fatal_error.txt)
          else
            ERR_TEXT="Der Render-Workflow wurde abgebrochen oder ist fehlgeschlagen, bevor ein Fehlerbericht geschrieben werden konnte."
          fi

          {
            echo "### Render-Fehler"
            echo ""
            echo '```text'
            printf '%s\n' "$ERR_TEXT"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1
