name: Auto Merge -> main

# Bringt jeden Push auf einen Arbeitsbranch direkt nach `main`.
# Es werden bewusst KEINE Pull Requests erstellt oder gemerged.

on:
  push:
    branches-ignore:
      - main

permissions:
  contents: write
  actions: write

concurrency:
  group: auto-merge-main
  cancel-in-progress: false

jobs:
  merge-to-main:
    name: Direkt nach main mergen
    if: startsWith(github.ref, 'refs/heads/') && github.ref_name != 'main'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Branch direkt in main mergen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          LAST_MSG=$(git log -1 --pretty=%s "origin/$BRANCH")

          for attempt in 1 2 3; do
            git fetch origin main "$BRANCH"

            AHEAD=$(git rev-list --count "origin/main..origin/$BRANCH")
            if [ "$AHEAD" -eq 0 ]; then
              echo "Branch '$BRANCH' enthält keine neuen Commits gegenüber 'main'."
              exit 0
            fi

            RENDER_INPUTS_CHANGED="false"
            if ! git diff --quiet "origin/main...origin/$BRANCH" -- HearthandsType/ ClassicType/ backgrounds/ WomanRig.blend scripts/ tests/ requirements.txt; then
              RENDER_INPUTS_CHANGED="true"
            fi

            git checkout -B main origin/main
            git merge --no-ff "origin/$BRANCH" -m "Merge branch '$BRANCH' into main: $LAST_MSG"

            if git push origin main; then
              echo "Branch '$BRANCH' wurde direkt nach 'main' gemerged."
              break
            fi

            echo "Push nach main abgelehnt (Versuch $attempt), versuche es erneut ..."
            if [ "$attempt" -eq 3 ]; then
              echo "::error::Merge nach main konnte nach 3 Versuchen nicht gepusht werden."
              exit 1
            fi
            sleep 5
          done

          # Render-Eingabenänderungen manuell auslösen (GITHUB_TOKEN-Pushes starten kein push-Event)
          if [ "$RENDER_INPUTS_CHANGED" = "true" ]; then
            gh workflow run render-avatar.yml --ref main || true
          fi
