name: Debug Scene Dump (temporär)

on:
  push:
    paths:
      - 'debug-trigger.txt'

permissions:
  contents: write

jobs:
  dump:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Setup & Dump
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
        run: |
          set -uo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xvfb libegl1 libgl1 libgl1-mesa-dri libglx-mesa0 libgbm1 libgles2 libxrender1 libxfixes3 libxi6 libxkbcommon0 libsm6 libice6 libxcursor1 libxinerama1 libxrandr2 >/dev/null
          pip install --quiet -r requirements.txt
          rm -rf /tmp/debug_out
          LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a -s "-screen 0 1280x720x24 +extension GLX +render -noreset" \
            python scripts/debug_scene_dump.py > /tmp/debug_stdout.log 2>&1 || true
          tail -n 200 /tmp/debug_stdout.log
          ls -la /tmp/debug_out || true

      - name: Publish dump as tag
        run: |
          set -uo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cd /tmp/debug_out || exit 1
          : > /tmp/debug_stdout.log.tail
          cp /tmp/debug_stdout.log /tmp/debug_out/stdout.log
          git init -q /tmp/dbg_repo
          cp -r /tmp/debug_out/. /tmp/dbg_repo/
          cd /tmp/dbg_repo
          git add -A
          git commit -qm "debug dump"
          git push --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/tags/debug-dump
