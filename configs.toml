# Roblox-Benutzername, z. B. MertaStudios. @ am Anfang ist optional.
username = "MertaStudios"

# Erlaubt: "transparent", Hex-Farbe #RGB oder #RRGGBB,
# direkte http(s)-Bild-URL (max. 50 MB) oder lokaler Name als "Farbordner/Motiv", z. B. "lila/herzen-konfetti".
# Unterstützte lokale Formate: PNG, JPG/JPEG, WebP, TIFF und BMP.
background = "transparent"

# Erlaubte Werte: "Glossy" (bisheriger Glanz) oder "Matt" (hohe Rauheit, kein Klarlack).
material = "Glossy"

[outline]
# Dicke in Prozent der Bildbreite (Dezimalzahlen erlaubt, 0 bis 100).
# Bei 2000 px Bildbreite ist 1 = 20 px. 0 deaktiviert die Umrandung.
thickness_percent = 1

# true = Umrandung nach außen vom Avatar weg; false = nach innen auf den Avatar.
outside = true

# Punkt, ab dem die Umrandung ausblendet (0 bis 100 Prozent der Umrandungsdicke).
# 0 = Fade über die ganze Dicke; 50 = erste Hälfte deckend, danach Fade;
# 100 = die gesamte Umrandung bleibt deckend.
fade_start_percent = 0

# Erlaubt: Hex-Farbe #RGB oder #RRGGBB, außerdem "white" oder "black".
color = "white"
