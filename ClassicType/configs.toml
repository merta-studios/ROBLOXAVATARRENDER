# Roblox-Benutzername, z. B. MertaStudios. @ am Anfang ist optional.
username = "MertaStudios"

# Hintergrund: "transparent", Hex-Farbe #RGB oder #RRGGBB, direkte http(s)-Bild-URL
# (max. 50 MB), lokaler Motivname (Originalfarbe) oder "Farbordner/Motiv", z. B.
# "lila/herzen-konfetti", "weiss/softes-licht" oder "schwarz/neon-linien".
# Die Hintergründe selbst wohnen weiterhin im geteilten Ordner backgrounds/
# und sind nicht in diesen GFX-Typ-Ordner eingezogen.
background = "transparent"

# Erlaubte Werte: "Glossy" (bisheriger Glanz) oder "Matt" (hohe Rauheit, kein Klarlack).
material = "Glossy"

# Classic-Shirt, -Hose, -T-Shirt und Face-Decal werden automatisch als
# R15-Teiltexturen auf Körpersegmente projiziert (scripts/r15_clothing.py).
# Individuelle R15-Meshes nutzen ihre eigenen Texturen; fehlende Segmente
# fallen einzeln auf den offiziellen Blocky-Rig zurück.
# Das Shirt liegt dabei auf Ober- und Untertorso; bei einem Avatar, der ueber
# den Bildrand hinausgeht, wird die Outline nicht als Randlinie gezeichnet.

# Dieser GFX-Typ ("ClassicType") lädt den Avatar als R15 komplett über die
# Roblox Avatar/Open-Cloud-API statt aus dem R6-Rig-Setup von HearthandsType.
# Der echte v4-Endpunkt braucht ein .ROBLOSECURITY-Cookie; der Client nutzt
# deshalb den funktionierenden öffentlichen v2-Endpunkt. Layered Clothing
# (Asset-Typen 64 bis 72) und Accessoires vom Typ "Equipment" werden nicht geladen.

# Pose des Avatars:
#   "None"      - normales Stehen (Standard)
#   "Equipped"  - die am Avatar des Spielers bereits ausgerüstete Pose
#                 (die auch auf seinem Profil am Avatar angewendet wird)
#   "Emote"     - Pose aus einem Emote (Animation) nach emote_asset_id,
#                 eingefroren am Moment, der auch in der Emote-Vorschau zu sehen ist
#                 (wird per Roblox Open Cloud API abgerufen, nicht geraten)
pose = "Equipped"

# Asset-ID des Emotes, nur relevant wenn pose = "Emote" steht.
emote_asset_id = 0

# Drehung des Avatars in Grad um die vertikale Achse:
# 0 = schaut zur Mitte, 45 = schräg nach rechts, -45 = schräg nach links.
rotation_deg = 30

# Abstand von oben und unten in Prozent der Avatar-Höhe. Die Avatar-Höhe ist die
# Länge zwischen dem höchsten und tiefsten Punkt des 3D-Modells.
# 100 = oben bzw. unten noch eine komplette Avatar-Höhe Platz, bevor der Avatar
# beginnt; 10 = nur 10 Prozent davon; -10 bedeutet, der Avatar rutscht bereits zu
# 10% in den Bildrand hinein.
abstand_oben = 5
abstand_unten = 5

# Render-Hinweis: Dieser GFX-Typ wird mit einer eigenen leeren Szene
# (scripts/classic_render.py) und ohne R6-Blend-Datei gerendert.
